name: Release

# Builds the frontend, attaches it to a GitHub release, and dispatches a
# lab-backend release embedding this version.
#
# Every master push cuts the next patch release automatically (put
# '[skip release]' in the commit message to opt out). workflow_dispatch
# does the same with a selectable bump, and publishing a release by hand
# enters at the build step.

on:
  push:
    branches:
      - master
    paths-ignore:
      - '**.md'
      - '.github/**'
      - '.claude/**'
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      bump:
        description: 'Version bump type'
        required: true
        default: 'patch'
        type: choice
        options:
          - patch
          - minor
          - major

permissions:
  contents: write

# Serialized so concurrent runs cannot compute the same next tag.
concurrency:
  group: release

jobs:
  release:
    name: Build and Publish Release
    if: github.event_name != 'push' || !contains(github.event.head_commit.message, '[skip release]')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      # A release created here with GITHUB_TOKEN emits no workflow events,
      # so this run does not re-trigger itself via the release trigger.
      - name: Resolve release tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "${{ github.event_name }}" = "release" ]; then
            TAG_NAME="${{ github.event.release.tag_name }}"
          else
            LATEST_TAG=$(git tag -l 'v*' | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -n 1)

            if [ -z "$LATEST_TAG" ]; then
              NEW_VERSION="0.0.1"
            else
              VERSION="${LATEST_TAG#v}"
              IFS='.' read -r major minor patch <<< "$VERSION"
              # inputs.bump is empty on push events, falling through to patch.
              case "${{ inputs.bump }}" in
                major) NEW_VERSION="$((major + 1)).0.0" ;;
                minor) NEW_VERSION="${major}.$((minor + 1)).0" ;;
                *)     NEW_VERSION="${major}.${minor}.$((patch + 1))" ;;
              esac
            fi

            TAG_NAME="v${NEW_VERSION}"
            echo "Latest tag: ${LATEST_TAG:-none}, new tag: $TAG_NAME"

            gh release create "$TAG_NAME" \
              --repo "${{ github.repository }}" \
              --target "${{ github.sha }}" \
              --title "$TAG_NAME" \
              --generate-notes
          fi

          echo "TAG_NAME=$TAG_NAME" >> $GITHUB_ENV

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: 'pnpm'
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build project
        run: pnpm build

      - name: Create build archives
        run: |
          tar -czf lab-${TAG_NAME}.tar.gz -C dist .
          cd dist && zip -r ../lab-${TAG_NAME}.zip . && cd ..

      - name: Upload release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "$TAG_NAME" \
            --repo "${{ github.repository }}" \
            --clobber \
            "lab-${TAG_NAME}.tar.gz" \
            "lab-${TAG_NAME}.zip"

      # Assets are uploaded, so lab-backend can now cut a release that
      # embeds this frontend version.
      - name: Trigger lab-backend release
        if: github.event_name != 'release' || !github.event.release.prerelease
        uses: peter-evans/repository-dispatch@28959ce8df70de7be546dd1250a005dd32156697 # v4.0.1
        with:
          token: ${{ secrets.EPOBOT_TOKEN }}
          repository: ethpandaops/lab-backend
          event-type: frontend-release
          client-payload: '{"frontend_tag": "${{ env.TAG_NAME }}"}'
