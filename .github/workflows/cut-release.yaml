name: Cut Release

# Computes the next version tag and publishes a GitHub release.
# Publishing the release triggers the Release workflow, which builds the
# frontend, attaches the archives, and dispatches a lab-backend release.

on:
  workflow_dispatch:
    inputs:
      bump:
        description: 'Version bump type'
        required: true
        default: 'patch'
        type: choice
        options:
          - patch
          - minor
          - major

permissions:
  contents: write

jobs:
  cut-release:
    name: Tag and Publish Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Compute next version
        id: version
        run: |
          LATEST_TAG=$(git tag -l 'v*' | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -n 1)

          if [ -z "$LATEST_TAG" ]; then
            NEW_VERSION="0.0.1"
          else
            VERSION="${LATEST_TAG#v}"
            IFS='.' read -r major minor patch <<< "$VERSION"
            case "${{ inputs.bump }}" in
              major) NEW_VERSION="$((major + 1)).0.0" ;;
              minor) NEW_VERSION="${major}.$((minor + 1)).0" ;;
              *)     NEW_VERSION="${major}.${minor}.$((patch + 1))" ;;
            esac
          fi

          echo "Latest tag: ${LATEST_TAG:-none}, new tag: v${NEW_VERSION}"
          echo "new_tag=v${NEW_VERSION}" >> $GITHUB_OUTPUT

      # EPOBOT_TOKEN (not GITHUB_TOKEN) so the release publish event
      # triggers the Release workflow.
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.EPOBOT_TOKEN }}
        run: |
          gh release create "${{ steps.version.outputs.new_tag }}" \
            --repo "${{ github.repository }}" \
            --target "${{ github.sha }}" \
            --title "${{ steps.version.outputs.new_tag }}" \
            --generate-notes
