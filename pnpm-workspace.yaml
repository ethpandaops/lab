saveExact: true

# Refuse a version published with weaker provenance than an earlier one.
trustPolicy: no-downgrade

# The only install scripts that run: esbuild fetches its binary and msw copies
# its service worker into public/.
allowBuilds:
  esbuild: true
  msw: true

peerDependencyRules:
  allowedVersions:
    # echarts-gl 2 declares echarts ^5; Lab runs it on echarts 6.
    echarts-gl>echarts: '6'
